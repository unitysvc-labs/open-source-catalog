# Radicale, one private instance per enrollment. The user name and password are bound from the channel's
# `environment` in offering.json; nothing in this file is secret.
# Radicale keeps its users in an htpasswd file and has no environment setting for one, and it has no page where
# a user changes a password. So on every start the entrypoint below writes that file from the two bound
# parameters with the image's own `htpasswd` (bcrypt), outside the data volume, and then starts Radicale the way
# the image does. The enrollment's parameters are therefore always the credentials in force, and no password
# hash is stored with the calendars. If the file cannot be written the container stops, so Radicale never
# starts without authentication. All other settings are Radicale's documented command-line options, so no
# configuration file is needed. The script uses backticks and `printenv`, not a dollar sign, so neither Docker
# Compose nor the platform rewrites it.
services:
  radicale:
    image: ghcr.io/kozea/radicale:3.9.2@sha256:c74545ef669a3166646ec13438a31b5d0bfff198d8ba7ecd214c0a5f40f03fb4
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        [ -n "`printenv RADICALE_USER`" ] && [ -n "`printenv RADICALE_PASSWORD`" ] \
          || { echo "RADICALE_USER and RADICALE_PASSWORD must be set" >&2; exit 1; }
        printenv RADICALE_PASSWORD | htpasswd -iBc -C 10 /tmp/radicale-users "`printenv RADICALE_USER`" \
          || { echo "could not write the users file" >&2; exit 1; }
        exec /app/bin/python /app/bin/radicale \
          --hosts 0.0.0.0:5232 \
          --auth-type htpasswd \
          --auth-htpasswd-filename /tmp/radicale-users \
          --auth-htpasswd-encryption bcrypt \
          --auth-cache-logins true \
          --rights-type owner_only \
          --storage-filesystem-folder /var/lib/radicale/collections \
          --storage-filesystem-cache-folder /tmp/radicale-cache \
          --storage-use-cache-subfolder-for-item true \
          --storage-use-cache-subfolder-for-history true \
          --storage-use-cache-subfolder-for-synctoken true
    ports:
      - 5232
    volumes:
      # The calendars and address books: one folder per collection under collections/collection-root/<user>/,
      # one .ics or .vcf file per event or contact. The channel decides whether this volume persists, in the
      # radicale folder of the customer's home (offering.json, `volumes`); under plain Docker it is an ordinary
      # named volume. Radicale's item cache and sync tokens are rebuilt from these files and are kept outside
      # it, in the container's temporary disk.
      - data:/var/lib/radicale
    healthcheck:
      # The built-in web interface's page; it needs no sign-in, so the check carries no credential.
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:5232/.web/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 110s
volumes:
  data:
