# Dashy, one private dashboard per enrollment. The login name and password are bound from the channel's
# `environment` in offering.json; the settings below are the instance's fixed, non-secret ones.
services:
  dashy:
    image: lissy93/dashy:4.10.0@sha256:c181b9d1fdfce269546755c4456f63152d3690dac80fb32d159053089bcc8199
    # The image keeps its starter conf.yml inside /app/user-data, which an empty volume hides. Copy the
    # starter in on the first start only, so the dashboard has a configuration to show and to edit.
    entrypoint: [/sbin/tini, --]
    command:
      - sh
      - -c
      - test -f /app/user-data/conf.yml || cp /app/dist/conf.yml /app/user-data/conf.yml; exec node server.js
    ports:
      - 8080
    volumes:
      # conf.yml, icons and the backups Dashy makes when you save from its editor. The channel decides whether
      # this volume persists, in the dashy folder of the customer's home (offering.json, `volumes`); under
      # plain Docker it is an ordinary named volume.
      - data:/app/user-data
    healthcheck:
      test: [CMD, node, services/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  data:
