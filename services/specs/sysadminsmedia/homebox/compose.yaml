# Homebox, one private instance per enrollment. The API-key pepper and the registration switch are bound from
# the channel's `environment` in offering.json; the values below are the instance's fixed, non-secret settings.
services:
  homebox:
    # The upstream "rootless" variant: the regular image, run as the unprivileged user 65532.
    image: ghcr.io/sysadminsmedia/homebox:0.27.1-rootless@sha256:6bb4472e91d3084d292ce654772e26df765d01aa0d38aa7077a7bb07b7d44ac7
    ports:
      - 7745
    environment:
      # The instance is reached through the platform's HTTPS front end; upstream requires this behind a proxy.
      HBOX_OPTIONS_TRUST_PROXY: "true"
      # Send no usage data to the Homebox project (also the upstream default).
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      # The image's default database path with journal_mode=DELETE instead of WAL, so the database is one
      # self-contained file. In WAL mode recent changes sit in homebox.db-wal, which the platform does not copy
      # to the customer's home, so a copy of homebox.db alone would miss them.
      HBOX_DATABASE_SQLITE_PATH: "/data/homebox.db?_pragma=busy_timeout=2000&_pragma=journal_mode=DELETE&_fk=1&_time_format=sqlite"
    volumes:
      # The SQLite database (homebox.db) and the uploaded attachments. The channel decides whether this volume
      # persists, in the homebox folder of the customer's home (offering.json, `volumes`); under plain Docker
      # it is an ordinary named volume.
      - data:/data
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, -O, /dev/null, "http://127.0.0.1:7745/api/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  data:
