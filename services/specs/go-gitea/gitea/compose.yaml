# Gitea, one private instance per enrollment. The administrator, the secrets and the address are bound from the
# channel's `environment` in offering.json; the values below are the instance's fixed, non-secret settings.
# This is the rootless image (user git, uid 1000). Only HTTP (port 3000) is exposed, so Git over SSH is not available.
services:
  gitea:
    image: gitea/gitea:28.4.0-rootless@sha256:15ab7fadb44981a2b781f40c712cad07066197f395100ea1c6326e14e5bb073a
    # Gitea has no environment setting that creates the first administrator once the installer is locked, so this
    # entrypoint runs the image's own setup, migrates the database (the administrator cannot be created before its tables exist), creates the administrator with `gitea admin user create` (it fails
    # harmlessly when the user already exists, as it does on every restart over kept data), then starts the server.
    # It uses backticks and `printenv` rather than a dollar sign, so Compose and the platform leave it untouched.
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/local/bin/docker-setup.sh || exit 1
        gitea -c `printenv GITEA_APP_INI` migrate || exit 1
        gitea -c `printenv GITEA_APP_INI` admin user create --admin --username `printenv ADMIN_USERNAME` --password `printenv ADMIN_PASSWORD` --email `printenv ADMIN_EMAIL` --must-change-password=false || true
        exec gitea -c `printenv GITEA_APP_INI` web
    ports:
      - 3000
    environment:
      # The configuration file is kept beside the data so that the secrets Gitea generates itself (OAuth and LFS
      # signing keys) survive a restart; the image's default, /etc/gitea, is not persisted.
      GITEA_APP_INI: /var/lib/gitea/app.ini
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__security__INSTALL_LOCK: "true"
      # Anyone who can reach the address could otherwise create an account.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__PUBLIC_URL_DETECTION: auto
      GITEA__other__SHOW_FOOTER_VERSION: "false"
    volumes:
      # Repositories, the SQLite database (data/gitea.db), app.ini, attachments, avatars, indexes and sessions.
      # The channel decides whether this volume persists, in the gitea folder of the customer's home
      # (offering.json, `volumes`); under plain Docker it is an ordinary named volume.
      - data:/var/lib/gitea
    healthcheck:
      test: [CMD, curl, -f, "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  data:
