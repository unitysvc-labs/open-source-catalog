# draw.io (diagrams.net) self-hosted editor, one private instance per enrollment. It is a static web app served
# by Tomcat (HTTP port 8080, user tomcat uid 1001): it keeps no data on the server, so there are no volumes.
# Cloud storage sign-in (Google Drive, OneDrive, GitLab) stays off because no client IDs are set.
services:
  drawio:
    image: jgraph/drawio:32.7.7@sha256:9911eb718f41ad68bd5f348f1c8ae4c54e032580d12b1c0a6bb65982f4e04576
    ports:
      - 8080
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
