# ntfy, one private instance per enrollment. Authentication is configured by
# the channel's `environment` in offering.json (access token, users); the
# values below are the instance's fixed, non-secret settings.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.1
    # ntfy takes its access tokens as one value, `<user>:<token>:<label>` (NTFY_AUTH_TOKENS). The channel
    # binds the token on its own (NTFY_ACCESS_TOKEN), because the platform keeps it as a secret and delivers
    # a secret only as a whole value; this command puts it into the form ntfy reads. It uses backticks and
    # `printenv` rather than a dollar sign, so Compose and the platform leave it untouched.
    entrypoint:
      - sh
      - -c
      - export NTFY_AUTH_TOKENS=admin:`printenv NTFY_ACCESS_TOKEN`:enrollment && exec ntfy serve
    ports:
      - 80
    environment:
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      # Storage is ephemeral: the cache and auth databases live in /tmp and
      # are recreated whenever the instance starts.
      NTFY_CACHE_FILE: /tmp/cache.db
      NTFY_AUTH_FILE: /tmp/user.db
      # Deny anonymous access; clients authenticate with the access token.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    healthcheck:
      test: [CMD-SHELL, "wget -q --tries=1 -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
