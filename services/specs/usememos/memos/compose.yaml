# Memos, one private instance per enrollment. It needs no environment: the first account registered becomes
# the administrator (see usage.md). The image has no curl or wget, so there is no healthcheck.
services:
  memos:
    image: neosmemo/memos:26.11.2@sha256:3c7bd779510403350465ecabb7e6fbc0887206f9d55b8decf51a205613fa5616
    ports:
      - 5230
    volumes:
      # The SQLite database and uploaded attachments. The channel decides whether this volume persists, in the
      # memos folder of the customer's home (offering.json, `volumes`); under plain Docker it is an ordinary
      # named volume.
      - data:/var/opt/memos
volumes:
  data:
