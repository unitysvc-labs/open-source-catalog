# Node-RED, one private instance per enrollment. The administrator's name and password are bound from the
# channel's `environment` in offering.json; nothing in this file is secret.
# A stock Node-RED serves its editor and admin API to anyone who has the address, and the image has no
# environment setting for sign-in: it is configured with an `adminAuth` block in /data/settings.js that holds a
# bcrypt hash. So when /data/settings.js does not exist yet, the entrypoint below copies the image's default
# settings file and inserts two settings at the top: `adminAuth`, with one administrator whose password hash is
# made by the bcryptjs module Node-RED ships (the method its "Securing Node-RED" page documents), and a random
# `credentialSecret`, the key Node-RED encrypts stored node credentials with. Only then does it start the
# image's own entrypoint. The file is written under another name and renamed, so a failed step leaves no
# settings file and the container stops instead of starting an open editor. When the file already exists (a
# restart, or data restored from an earlier enrollment) nothing is changed. The script has no dollar sign, so
# neither Docker Compose nor the platform rewrites it; the password is read from the environment by Node.js.
services:
  node-red:
    image: nodered/node-red:5.0.10@sha256:3622786c15b6f57f61bf1d0ece59d06a18b742c5c8955f588d189b6bee8dc97d
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f /data/settings.js ]; then
          node -e '
            const fs = require("fs");
            const user = process.env.ADMIN_USERNAME;
            const pass = process.env.ADMIN_PASSWORD;
            if (!user || !pass) throw new Error("ADMIN_USERNAME and ADMIN_PASSWORD must be set");
            const marker = "module.exports = {";
            const parts = fs.readFileSync("/usr/src/node-red/node_modules/node-red/settings.js", "utf8").split(marker);
            if (parts.length !== 2) throw new Error("unexpected default settings file");
            const admin = { username: user, password: require("bcryptjs").hashSync(pass, 8), permissions: "*" };
            const added = [
              "    // Added at the first start by the UnitySVC recipe; edit as you would any Node-RED settings file.",
              "    adminAuth: " + JSON.stringify({ type: "credentials", users: [admin] }) + ",",
              "    credentialSecret: " + JSON.stringify(require("crypto").randomBytes(32).toString("hex")) + ",",
            ].join("\n");
            fs.writeFileSync("/data/settings.js.new", parts[0] + marker + "\n" + added + "\n" + parts[1]);
            require("/data/settings.js.new");
            fs.renameSync("/data/settings.js.new", "/data/settings.js");
          ' || { rm -f /data/settings.js.new; echo "first-run setup failed" >&2; exit 1; }
        fi
        exec ./entrypoint.sh
    ports:
      - 1880
    volumes:
      # The user directory: settings.js, the flows and their encrypted credentials, context data, and the
      # palette nodes you install (package.json and node_modules). The channel decides whether this volume
      # persists, in the node-red folder of the customer's home (offering.json, `volumes`); under plain Docker
      # it is an ordinary named volume.
      - data:/data
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:1880/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 110s
volumes:
  data:
