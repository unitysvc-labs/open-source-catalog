# FreshRSS (SQLite), one private instance per enrollment. The administrator and the passwords are bound from the
# channel's `environment` in offering.json; the values below are the instance's fixed, non-secret settings.
services:
  freshrss:
    image: freshrss/freshrss:1.31.0@sha256:31b0acfcb8e11600aa6ce697ff8d9d7ea620c85d766e5e764f487b433d20d066
    ports:
      - 80
    environment:
      # Built-in cron job: refreshes every feed twice an hour (at minutes 17 and 47).
      CRON_MIN: "17,47"
      # The arguments that create the administrator the first time FreshRSS runs. The channel binds the name
      # and the two passwords each on its own (the platform keeps the passwords as secrets and delivers a
      # secret only as a whole value). FreshRSS's entrypoint evaluates this value in a shell, which is what
      # reads them here; backticks and `printenv` rather than a dollar sign, so Compose and the platform
      # leave it untouched.
      FRESHRSS_USER: "--user=`printenv FRESHRSS_ADMIN_USER` --password=`printenv FRESHRSS_ADMIN_PASSWORD` --api-password=`printenv FRESHRSS_API_PASSWORD` --no-default-feeds"
    volumes:
      # Configuration, users, the SQLite databases and caches. The channel decides whether these volumes
      # persist, in the freshrss folder of the customer's home (offering.json, `volumes`); under plain Docker
      # they are ordinary named volumes.
      - data:/var/www/FreshRSS/data
      - extensions:/var/www/FreshRSS/extensions
volumes:
  data:
  extensions:
