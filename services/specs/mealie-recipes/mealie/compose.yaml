# Mealie, one private instance per enrollment. The time zone is bound from the channel's `environment` in
# offering.json; the values below are the instance's fixed, non-secret settings. Mealie has no setting for
# the first administrator's password: a new database gets the upstream default account, which the customer
# replaces in the first-sign-in setup (see usage.md).
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    ports:
      - 9000
    environment:
      # Listen on IPv4 (the image's default tries a dual-stack [::] socket first).
      API_HOST: 0.0.0.0
      # Nobody can register an account from the sign-in page; the administrator creates or invites users.
      ALLOW_SIGNUP: "false"
    volumes:
      # The SQLite database (mealie.db), the generated secrets, recipe images and assets, backups and the log.
      # The channel decides whether this volume persists, in the mealie folder of the customer's home
      # (offering.json, `volumes`); under plain Docker it is an ordinary named volume.
      - data:/app/data
    healthcheck:
      test: [CMD, curl, -fs, "http://127.0.0.1:9000/api/app/about"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  data:
