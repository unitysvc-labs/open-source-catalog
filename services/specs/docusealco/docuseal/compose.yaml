# DocuSeal, one private instance per enrollment, on its built-in SQLite database (no DATABASE_URL). The
# secret key is bound from the channel's `environment` in offering.json; the values below are the
# instance's fixed, non-secret settings.
services:
  docuseal:
    image: docuseal/docuseal:3.4.0@sha256:b664cc84014f607f090140973f2e082cc551954d42f6f17e07fdd54dee6fdc08
    ports:
      - 3000
    environment:
      # The platform terminates HTTPS in front of the instance: treat requests as secure (secure cookies,
      # https links). /up, the health check, is exempt from any redirect.
      FORCE_SSL: "true"
    volumes:
      # The SQLite database (db.sqlite3) and the uploaded and signed documents (attachments/). The channel
      # decides whether this volume persists (offering.json, `volumes`); under plain Docker it is an
      # ordinary named volume.
      - data:/data/docuseal
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
volumes:
  data:
