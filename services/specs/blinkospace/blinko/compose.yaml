# Blinko with its PostgreSQL database, one private stack per enrollment. The database password, the
# signing secret, the matching DATABASE_URL and the first administrator are bound from the channel's
# `environment` in offering.json; the values below are the stack's fixed, non-secret settings.
services:
  blinko:
    image: blinkospace/blinko:1.8.9@sha256:ebbdcc375451570fad37319dea443c062d2a451a45d4f2ee0d98189d4b7615a5
    # `depends_on` does not order startup on the platform, and Blinko's own start script does not retry:
    # it runs migrations once, so a database that is not up yet leaves an empty schema. Wait for the
    # database first. Then, once Blinko answers, create the first administrator from the bound name and
    # password: Blinko otherwise lets the first visitor to register become the administrator. After the
    # first user exists Blinko refuses registration, so on a restart this call is refused and harmless.
    command:
      - /usr/local/bin/dumb-init
      - --
      - /bin/sh
      - -c
      - |
        until nc -z postgres 5432; do sleep 2; done
        ./start.sh &
        until wget -q -O /dev/null http://127.0.0.1:1111/; do sleep 2; done
        node -e "fetch('http://127.0.0.1:1111/api/v1/user/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:process.env.BLINKO_ADMIN_NAME,password:process.env.BLINKO_ADMIN_PASSWORD})}).then(r=>r.text()).then(t=>console.log('first administrator:',t.slice(0,60)))"
        wait
    ports:
      - 1111
    environment:
      NODE_ENV: production
    volumes:
      # Uploaded files and attachments. The channel decides whether this volume persists, in the blinko
      # folder of the customer's home (offering.json, `volumes`); under plain Docker it is an ordinary
      # named volume.
      - blinko-files:/app/.blinko
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    # Declared so the platform gives this service a name and lets Blinko reach it: a service
    # without ports gets no address inside the instance, and only declared ports are open between services.
    ports:
      - 5432
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinko
      PGDATA: /var/lib/postgresql/data/pgdata
    # The data directory is scratch: it cannot be kept in the customer's storage, because the copy skips the
    # empty files and folders PostgreSQL needs and keeps no file modes, so a restored directory does not
    # start. What persists is a dump in /backup. On a start with no restored data directory the dump is restored
    # before the server listens on the network (so Blinko never sees a half-restored database); it is
    # rewritten every five minutes and once more at a normal stop. The server is stopped with SIGINT (a fast
    # shutdown) sent to the postmaster. Backticks and `printenv`, no dollar sign.
    command:
      - sh
      - -c
      - |
        dump() { pg_dump -U blinko -d blinko -Fc -f /backup/db.dump.tmp && mv /backup/db.dump.tmp /backup/db.dump; }
        if [ ! -e /var/lib/postgresql/data/restored ] && [ -s /backup/db.dump ]; then
          rm -rf "`printenv PGDATA`"
          docker-entrypoint.sh postgres -c listen_addresses= -p 5433 &
          until pg_isready -q -p 5433 -U blinko -d blinko; do sleep 1; done
          pg_restore -p 5433 -U blinko -d blinko --no-owner --exit-on-error /backup/db.dump || exit 1
          kill -INT `head -1 "\`printenv PGDATA\`/postmaster.pid"`
          while [ -e "`printenv PGDATA`/postmaster.pid" ]; do sleep 1; done
        fi
        docker-entrypoint.sh postgres &
        trap 'dump; kill -INT `head -1 "\`printenv PGDATA\`/postmaster.pid"`; while [ -e "\`printenv PGDATA\`/postmaster.pid" ]; do sleep 1; done; exit 0' TERM INT
        until pg_isready -q -h 127.0.0.1 -U blinko -d blinko; do sleep 1; done
        touch /var/lib/postgresql/data/restored /tmp/restored
        while true; do sleep 300 & wait; dump; done
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backup
    healthcheck:
      # Ready only once any restore has finished and the server answers on the network.
      test: [CMD-SHELL, "test -f /tmp/restored && pg_isready -h 127.0.0.1 -U blinko -d blinko"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 110s
volumes:
  blinko-files:
  postgres-data:
  postgres-backup:
