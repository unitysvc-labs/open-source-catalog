# Miniflux with its PostgreSQL database, one private stack per enrollment. The administrator login, the
# database password and the matching DATABASE_URL are bound from the channel's `environment` in
# offering.json; the values below are the stack's fixed, non-secret settings.
services:
  app:
    image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
    ports:
      - 8080
    # depends_on does not order startup on the platform, and Miniflux exits when it cannot reach its
    # database. Its own migration command is retried until PostgreSQL accepts connections (and, after a
    # stop, until the database's dump has been restored); then the server starts. CREATE_ADMIN creates the
    # administrator only when no user of that name exists, so a restart leaves the account alone.
    command:
      - sh
      - -c
      - "until /usr/bin/miniflux -migrate; do echo 'waiting for the database'; sleep 3; done && exec /usr/bin/miniflux"
    environment:
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      # Every instance is reached over HTTPS through the platform's front end: mark the session cookies
      # Secure and send the HSTS header.
      HTTPS: "1"
    healthcheck:
      test: [CMD, /usr/bin/miniflux, -healthcheck, auto]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 110s
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    # Declared so the platform gives this service a name and lets Miniflux reach it: a service
    # without ports gets no address inside the instance, and only declared ports are open between services.
    ports:
      - 5432
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_DB: miniflux
      PGDATA: /var/lib/postgresql/data/pgdata
    # The data directory is scratch: it cannot be kept in the customer's storage, because the copy skips the
    # empty files and folders PostgreSQL needs and keeps no file modes, so a restored directory does not
    # start. What persists is a dump in /backup. On a start with no restored data directory the dump is restored
    # before the server listens on the network (so Miniflux never sees a half-restored database); it is
    # rewritten every five minutes and once more at a normal stop. The server is stopped with SIGINT (a fast
    # shutdown) sent to the postmaster. Backticks and `printenv`, no dollar sign.
    command:
      - sh
      - -c
      - |
        dump() { pg_dump -U miniflux -d miniflux -Fc -f /backup/db.dump.tmp && mv /backup/db.dump.tmp /backup/db.dump; }
        if [ ! -e /var/lib/postgresql/data/restored ] && [ -s /backup/db.dump ]; then
          rm -rf "`printenv PGDATA`"
          docker-entrypoint.sh postgres -c listen_addresses= -p 5433 &
          until pg_isready -q -p 5433 -U miniflux -d miniflux; do sleep 1; done
          pg_restore -p 5433 -U miniflux -d miniflux --no-owner --exit-on-error /backup/db.dump || exit 1
          kill -INT `head -1 "\`printenv PGDATA\`/postmaster.pid"`
          while [ -e "`printenv PGDATA`/postmaster.pid" ]; do sleep 1; done
        fi
        docker-entrypoint.sh postgres &
        trap 'dump; kill -INT `head -1 "\`printenv PGDATA\`/postmaster.pid"`; while [ -e "\`printenv PGDATA\`/postmaster.pid" ]; do sleep 1; done; exit 0' TERM INT
        until pg_isready -q -h 127.0.0.1 -U miniflux -d miniflux; do sleep 1; done
        touch /var/lib/postgresql/data/restored /tmp/restored
        while true; do sleep 300 & wait; dump; done
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackup:/backup
    healthcheck:
      # Ready only once any restore has finished and the server answers on the network.
      test: [CMD-SHELL, "test -f /tmp/restored && pg_isready -h 127.0.0.1 -U miniflux -d miniflux"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous on purpose: the platform restarts a container that has not passed its check by the end
      # of this period, and a first start there (sandboxed, on a small size) is several times slower than
      # under Docker on a workstation.
      start_period: 110s
volumes:
  dbdata:
  dbbackup:
