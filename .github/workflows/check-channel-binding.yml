name: Check Channel Binding

# Fails when a channel would be advertised as Directly Usable (`unbound`) while
# it actually needs customer setup, when a param-named secret carries a default,
# when an Authorization header is a literal, or when a container setting uses
# customer_secrets instead of an enrollment parameter (issue #52).

# Pull requests run this inside "Test Recipes", which uploads only after it passes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/check_channel_binding.py"
      - ".github/workflows/check-channel-binding.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with unitysvc-sellers python scripts/check_channel_binding.py
