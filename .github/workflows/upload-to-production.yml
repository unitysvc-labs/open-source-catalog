name: Upload Data to Production

# Thin caller — logic lives in the shared reusable workflow so a fix lands
# once for all unitysvc-services-* repos. See unitysvc-labs/.github.
# Production uploads run manually or after a pull request is merged.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Send every service, ignoring the saved upload state (the state is still rewritten),
          instead of only the ones that changed since the last upload.
        type: boolean
        default: false

# One production upload at a time. Each run restores the newest saved upload state and saves its own, so runs that
# overlap (several pull requests merged together) each save a state that lacks what the others sent, and the last
# to finish wins: ten merges left a state with 6 of 16 services, and every pull request check then re-tested the
# missing ones. Queued, a run sees the state the one before it saved. A run sends everything that differs from the
# state, not only its own pull request's recipes, so when GitHub drops an older queued run for a newer one nothing
# is lost. A pull request closed without merging gets a group of its own: its job is skipped, and it must not
# take the place of a queued upload.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && 'upload-production' || format('not-an-upload-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    uses: unitysvc-labs/.github/.github/workflows/seller-upload-production.yml@main
    with:
      # Only a manual run can ask for a full resync; a merged pull request sends what changed.
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    secrets: inherit
    permissions:
      contents: write
